version: '3.8'

services:
  # Database Service (Official MongoDB Image)
  mongodb:
    image: mongo:latest
    container_name: task-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # Backend Service (Node.js / Express API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskmanage
    depends_on:
      - mongodb
    networks:
      - app-network

  # Frontend Service (React / Vite Built + Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# Custom Bridge Network for inter-service communication
networks:
  app-network:
    driver: bridge

# Persistent volume for MongoDB data
volumes:
  mongo-data:
    driver: local
